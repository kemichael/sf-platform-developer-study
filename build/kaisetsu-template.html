<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解説集 | Platform デベロッパー</title>
<style>/*__CSS__*/</style>
<style>
/* ===== 解説集ページ専用スタイル ===== */
.kai-body .topbar{position:sticky;top:0}
.kai-main{max-width:880px;margin:0 auto;padding:28px 22px 120px}
.kai-hero h1{font-size:30px;line-height:1.25;margin:6px 0 8px;color:var(--navy)}
.kai-hero p{color:var(--text-2);font-size:14px;line-height:1.8;margin:0 0 8px}
.kai-hero .note{font-size:12.5px;color:var(--text-3)}

/* --- ツールバー（セットタブ・検索・フィルタ） --- */
.kai-toolbar{position:sticky;top:var(--header-h);z-index:20;background:var(--app-bg);
  padding:14px 0 12px;margin:14px 0 18px;border-bottom:1px solid var(--border)}
.set-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  border-radius:99px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:7px}
.tab-btn:hover{border-color:var(--blue);color:var(--blue)}
.tab-btn .cnt{font-size:11px;font-weight:800;color:var(--text-3);background:var(--border-2);
  border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums}
.tab-btn.active{background:linear-gradient(95deg,#12b3a0,#0b7a6e);border-color:transparent;color:#fff}
.tab-btn.active .cnt{background:rgba(255,255,255,.22);color:#fff}
.kai-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.kai-search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;border:1px solid var(--border);
  background:var(--surface);border-radius:11px;padding:8px 13px;transition:.15s}
.kai-search:focus-within{border-color:var(--blue)}
.kai-search .ico{width:15px;height:15px;color:var(--text-3);flex-shrink:0}
.kai-search input{flex:1;border:none;background:transparent;color:var(--text);font-size:13.5px;
  font-family:var(--sans);outline:none;min-width:0}
.kai-search input::placeholder{color:var(--text-3)}
.kai-search .clear-btn{display:none;border:none;background:transparent;color:var(--text-3);cursor:pointer;
  padding:2px;border-radius:6px;line-height:0}
.kai-search .clear-btn:hover{color:var(--text)}
.kai-search .clear-btn .ico{width:14px;height:14px}
.kai-search.has-q .clear-btn{display:block}
.filter-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
.filter-toggle input{width:16px;height:16px;accent-color:var(--blue)}
.kai-stats{margin-top:10px;font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.kai-stats b{color:var(--text-2)}
.kai-stats .learned-stat{color:var(--ok);font-weight:700}

/* --- 問題カード --- */
.q-card{border:1px solid var(--border);background:var(--surface);border-radius:14px;
  padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow);scroll-margin-top:130px}
.q-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.q-set{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(95deg,#12b3a0,#0b7a6e);
  border-radius:7px;padding:4px 9px;letter-spacing:.03em}
.q-num{display:grid;place-items:center;min-width:30px;height:26px;padding:0 8px;border-radius:8px;
  background:var(--accent-soft);color:var(--blue);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.q-cat{font-size:11.5px;font-weight:700;color:var(--text-3);background:var(--border-2);border-radius:99px;padding:3px 10px}
.q-multi{font-size:11.5px;font-weight:700;color:#fff;background:var(--c-triv);border-radius:99px;padding:3px 10px}
.learn-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-3);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:.15s;flex-shrink:0}
.learn-btn .ico{width:13px;height:13px}
.learn-btn:hover{border-color:var(--ok);color:var(--ok)}
.learn-btn.active{background:var(--ok);border-color:var(--ok);color:#fff}
.q-card.learned{border-color:var(--c-sum-bd)}
.q-card.learned .q-text,.q-card.learned .opts,.q-card.learned .explain{opacity:.62}
.q-text{font-size:15px;line-height:1.85;color:var(--text);margin:0 0 14px}
.q-text p{margin:0 0 8px}
.q-text p:last-child{margin-bottom:0}

.opts{display:flex;flex-direction:column;gap:9px;transition:opacity .15s}
.opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--border);border-radius:11px;
  padding:11px 14px;background:var(--surface)}
.opt .mark{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);
  display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--text-2);background:var(--side-bg);transition:.12s}
.opt .otext{font-size:14px;line-height:1.7;color:var(--text);padding-top:1px}
.opt .otext code{font-size:.92em}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}

.explain{margin-top:14px;border-radius:11px;border:1px solid var(--c-sum-bd);background:var(--c-sum-bg);padding:13px 15px}
.explain-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--c-sum);margin-bottom:6px}
.explain-head .ico{width:15px;height:15px}
.explain-head .ans{margin-left:auto;font-size:12.5px}
.explain-body{font-size:13.5px;line-height:1.85;color:var(--text)}
.explain-body p{margin:0 0 7px}
.explain-body p:last-child{margin-bottom:0}
.explain-body code{font-size:.92em}

/* --- 自己チェックモード（解答を隠す） --- */
.reveal-btn{display:none;margin-top:14px;align-items:center;gap:7px;border:1.5px dashed var(--border);
  background:var(--side-bg);color:var(--text-2);border-radius:11px;padding:10px 16px;font-size:13px;font-weight:700;
  cursor:pointer;transition:.15s;width:100%;justify-content:center}
.reveal-btn:hover{border-color:var(--ok);color:var(--ok)}
.reveal-btn .ico{width:15px;height:15px}
#qList.hide-ans .q-card:not(.revealed) .opt.correct{border-color:var(--border);background:var(--surface)}
#qList.hide-ans .q-card:not(.revealed) .opt.correct .mark{background:var(--side-bg);border-color:var(--border);color:var(--text-2)}
#qList.hide-ans .q-card:not(.revealed) .explain{display:none}
#qList.hide-ans .q-card:not(.revealed) .reveal-btn{display:flex}

.empty-msg{text-align:center;color:var(--text-3);font-size:14px;padding:48px 0}

/* コード（問題文・解説中） */
.q-text code,.explain-body code,.opt .otext code{font-family:var(--mono);font-size:.9em;
  background:var(--inline-code-bg);color:var(--inline-code);padding:.1em .4em;border-radius:5px}
.q-text .code-block,.explain-body .code-block{margin:12px 0}
.q-text .code-block code,.explain-body .code-block code{background:none;color:var(--text);padding:0;border:none}

[hidden]{display:none !important}
@media(max-width:640px){
  .kai-main{padding:18px 14px 100px}
  .kai-controls{gap:10px}
  .q-card{padding:15px 14px}
}
</style>
</head>

<main class="kai-main">
  <div class="kai-hero">
    <h1>模擬試験 解説集</h1>
    <p>模擬試験 全セットの<b>正解と解説を一覧で読める</b>学習用ページです。セット切替・キーワード検索で復習したい問題をすぐ探せます。</p>
    <p class="note">「覚えた」チェックはブラウザに自動保存されます。「解答を隠して自己チェック」を ON にすると、正解と解説を伏せた状態で読み進められます。</p>
  </div>

  <div class="kai-toolbar">
    <div class="set-tabs" id="setTabs"></div>
    <div class="kai-controls">
      <label class="kai-search" id="searchWrap">
        <svg class="ico"><use href="#i-search"/></svg>
        <input type="search" id="searchBox" placeholder="キーワードで絞り込み（問題文・選択肢・解説）" autocomplete="off">
        <button type="button" class="clear-btn" id="clearBtn" aria-label="検索をクリア"><svg class="ico"><use href="#i-x"/></svg></button>
      </label>
      <label class="filter-toggle"><input type="checkbox" id="hideLearned">覚えた問題を隠す</label>
      <label class="filter-toggle"><input type="checkbox" id="selfCheck">解答を隠して自己チェック</label>
    </div>
    <div class="kai-stats" id="statLine"></div>
  </div>

  <div id="qList"></div>
  <p class="empty-msg" id="emptyMsg" hidden>該当する問題がありません。検索条件やフィルタを見直してください。</p>
